name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.1'
            laravel: '5.5'
            testbench: '~3.5.0'
            phpunit: '^7.5'
            dbal: '^2.13'
            composer: v2.2
          - php: '7.2'
            laravel: '6'
            testbench: '^4.0'
            phpunit: '^8.5'
            dbal: '^2.13'
            composer: v2.2
          - php: '7.2'
            laravel: '7'
            testbench: '^5.0'
            phpunit: '^8.5'
            dbal: '^2.13'
            composer: v2.2
          - php: '7.3'
            laravel: '8'
            testbench: '^6.0'
            phpunit: '^9.6'
            dbal: '^2.13'
            composer: v2.2
          - php: '8.0'
            laravel: '9'
            testbench: '^7.0'
            phpunit: '^9.6'
            dbal: '^3.0'
            composer: latest
          - php: '8.1'
            laravel: '10'
            testbench: '^8.0'
            phpunit: '^10.5'
            dbal: '^3.0'
            composer: latest
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'
            phpunit: '^11.5'
            dbal: '^3.0'
            composer: latest
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            phpunit: '^11.5'
            dbal: '^4.0'
            composer: latest
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'
            phpunit: '^12.5'
            dbal: '^4.0'
            composer: latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          tools: composer:${{ matrix.composer }}
          coverage: none
      - name: Allow intentional historical Laravel test rows
        if: matrix.composer == 'latest'
        run: composer config audit.block-insecure false
      - run: composer require --dev orchestra/testbench:${{ matrix.testbench }} phpunit/phpunit:${{ matrix.phpunit }} doctrine/dbal:${{ matrix.dbal }} --no-update --no-interaction
      - run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
